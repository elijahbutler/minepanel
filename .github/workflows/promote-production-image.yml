name: Promote fork production image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA of the tested image to promote
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-fork-production-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/minepanel

jobs:
  promote:
    if: github.repository != 'Ketbome/minepanel' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote tested main image to production
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi

          source_image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$SOURCE_SHA"
          source_digest="$(docker buildx imagetools inspect "$source_image" --format '{{.Manifest.Digest}}')"
          docker buildx imagetools create --tag "$TARGET_IMAGE" "$source_image"
          target_digest="$(docker buildx imagetools inspect "$TARGET_IMAGE" --format '{{.Manifest.Digest}}')"

          if [[ "$source_digest" != "$target_digest" ]]; then
            echo "Digest mismatch: source=$source_digest target=$target_digest" >&2
            exit 1
          fi

          echo "Promoted $source_image to $TARGET_IMAGE at $target_digest"
