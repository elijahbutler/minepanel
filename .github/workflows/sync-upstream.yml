name: Sync Upstream

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: Ketbome/minepanel
  SYNC_BRANCH: chore/sync-upstream

jobs:
  sync:
    if: github.repository == 'elijahbutler/minepanel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch fork and upstream branches
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "+refs/heads/main:refs/remotes/upstream/main"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"

          if git ls-remote --exit-code --heads origin "$SYNC_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags origin "+refs/heads/$SYNC_BRANCH:refs/remotes/origin/$SYNC_BRANCH"
          fi

      - name: Merge upstream changes
        id: merge
        run: |
          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "Fork main already contains upstream main."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git show-ref --verify --quiet "refs/remotes/origin/$SYNC_BRANCH"; then
            git switch --force-create "$SYNC_BRANCH" "origin/$SYNC_BRANCH"
          else
            git switch --create "$SYNC_BRANCH" "origin/main"
          fi

          if ! git merge-base --is-ancestor upstream/main HEAD; then
            if ! git merge --no-edit upstream/main; then
              git status --short
              echo "::error::Upstream changes conflict with the fork. Resolve the sync branch manually."
              exit 1
            fi
            git push --set-upstream origin "$SYNC_BRANCH"
          fi

          echo "required=true" >> "$GITHUB_OUTPUT"

      - name: Open sync pull request
        if: steps.merge.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_pr=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$SYNC_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$existing_pr" ]; then
            echo "Sync pull request #$existing_pr is already open."
            exit 0
          fi

          body=$(printf '%s\n\n%s\n' \
            "Merges the latest $UPSTREAM_REPOSITORY main branch into this fork." \
            "This pull request is maintained by the scheduled Sync Upstream workflow.")

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$SYNC_BRANCH" \
            --title "chore: sync upstream changes" \
            --body "$body"
